plugins {
    alias(libs.plugins.androidApplication)
}

android {
    namespace 'com.app.estudiaapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.app.estudiaapp"
        minSdk 24
        multiDexEnabled true
        targetSdk 34
        versionCode 1 
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        resources {
            // Removed PDFBox packaging rules after switching to PdfRenderer+OCR fallback
        }
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    //Dependencias manuales
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.material:material:1.12.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.2.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    // Remote Config for fetching OPENAI_API_KEY at runtime
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'

    // Document extraction: use PdfRenderer + Play Services Vision OCR instead of pdfbox-android
    // Ensure multidex support library is present (helps load classes from secondary dexes reliably)
    implementation 'androidx.multidex:multidex:2.0.1'
    // WorkManager for background processing and cancelable tasks
    implementation 'androidx.work:work-runtime:2.8.1'
    // EncryptedSharedPreferences for secure local storage of sensitive keys
    implementation 'androidx.security:security-crypto:1.1.0'
    // Play Services Vision text recognition (OCR) for PDF fallback
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    // Note: Apache POI was removed because it requires minSdk >= 26 and increases APK size.
    // For DOC/DOCX we fall back to plain-text extraction; consider server-side extraction for better fidelity.
    // Optional: Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:20.5.0'
}

// Apply Google services plugin to process google-services.json
apply plugin: 'com.google.gms.google-services'